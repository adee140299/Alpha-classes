<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#d3000a"/>
      <stop offset="100%" stop-color="#8b0006"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Icon Background with Rounded Superellipse -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="115" fill="url(#glowGrad)"/>

  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="6"/>

  <!-- Centered Alpha Symbol (α) with Premium Styling -->
  <g filter="url(#dropShadow)">
    <!-- Stylized Alpha Path -->
    <path d="M 360 170 C 330 170 300 190 270 230 C 235 185 195 160 150 160 C 95 160 55 205 55 270 C 55 335 98 380 155 380 C 205 380 248 350 285 300 L 350 395 C 358 406 372 408 382 400 C 392 392 394 378 386 368 L 332 290 C 355 255 372 230 382 222 C 390 216 398 214 406 216 C 416 218 426 212 428 200 C 430 188 422 178 410 174 C 394 170 376 170 360 170 Z M 155 220 C 180 220 208 238 236 270 C 206 312 178 332 152 332 C 122 332 105 308 105 270 C 105 232 125 220 155 220 Z" fill="#ffffff"/>
    
    <!-- Academic Cap / Star accent -->
    <circle cx="395" cy="140" r="18" fill="#fef08a"/>
    <path d="M 395 105 L 402 125 L 422 125 L 406 137 L 412 157 L 395 145 L 378 157 L 384 137 L 368 125 L 388 125 Z" fill="#fef08a"/>
  </g>

  <!-- Small Elegant Subtitle -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" fill-opacity="0.95" text-anchor="middle" letter-spacing="6">ALPHA CLASSES</text>
</svg>

