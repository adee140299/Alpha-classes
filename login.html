<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Portal — Alpha Classes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="icon" type="image/png" href="./images/app-icon-192.png">

  <!-- PWA & Mobile App Meta Tags (iOS & Android) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d3000a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Alpha Classes">
  <link rel="apple-touch-icon" href="./images/apple-touch-icon.png">
  <style>
    :root {
      --primary-red: #d3000a;
      --primary-red-hover: #b00008;
      --font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    body {
      font-family: var(--font-family);
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #f8fafc;
    }
    .login-container {
      width: 100%;
      max-width: 480px;
    }
    .login-card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      padding: 36px 32px;
      overflow: hidden;
      position: relative;
    }
    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-badge {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
      color: #fff;
      font-size: 26px;
      font-weight: 800;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);
      margin-bottom: 12px;
    }
    .brand-header h2 {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      margin: 0;
      color: #ffffff;
    }
    .brand-header p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 4px;
    }
    /* Dual Tabs */
    .portal-nav-tabs {
      display: flex;
      background: rgba(15, 23, 42, 0.6);
      padding: 5px;
      border-radius: 12px;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .portal-tab-btn {
      flex: 1;
      padding: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      text-align: center;
      color: #94a3b8;
      background: none;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .portal-tab-btn.active {
      background: var(--primary-red);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(211, 0, 10, 0.4);
    }
    .form-label {
      font-size: 0.82rem;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .form-control {
      background: rgba(15, 23, 42, 0.6);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: #ffffff;
      padding: 11px 14px;
      font-size: 0.92rem;
      transition: all 0.15s ease;
    }
    .form-control:focus {
      background: rgba(15, 23, 42, 0.8);
      border-color: #ef4444;
      color: #ffffff;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.25);
    }
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
      color: #ffffff;
      font-weight: 700;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 0.95rem;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.35);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-submit:hover {
      background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.45);
    }
    .demo-pill-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      color: #cbd5e1;
      padding: 6px 12px;
      font-size: 0.76rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      transition: all 0.15s ease;
    }
    .demo-pill-btn:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: #ef4444;
      color: #ef4444;
    }
    .back-home-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: #94a3b8;
      font-size: 0.85rem;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s ease;
    }
    .back-home-link:hover {
      color: #ffffff;
    }
    .error-alert {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.84rem;
      margin-bottom: 18px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="brand-header">
        <div class="brand-badge">α</div>
        <h2>ALPHA CLASSES</h2>
        <p>Specialized Coaching & Classroom Portal</p>
        <div class="mt-2">
          <span id="cloudStatusBadge" class="badge bg-success bg-opacity-25 text-white border border-success small" style="font-size: 0.72rem;">
            <i class="bi bi-cloud-check-fill text-success"></i> Google Cloud Live
          </span>
        </div>
      </div>

      <!-- Tab Switcher -->
      <div class="portal-nav-tabs">
        <button type="button" class="portal-tab-btn active" id="tabTeacherBtn">
          <i class="bi bi-person-workspace"></i> Teacher Login
        </button>
        <button type="button" class="portal-tab-btn" id="tabStudentBtn">
          <i class="bi bi-mortarboard-fill"></i> Student Portal
        </button>
      </div>

      <!-- Error Message -->
      <div id="loginErrorAlert" class="error-alert">
        <i class="bi bi-exclamation-triangle-fill me-1"></i> <span id="loginErrorText">Error message</span>
      </div>

      <!-- Form 1: Teacher & Staff Login -->
      <form id="teacherLoginForm">
        <div class="mb-3">
          <label class="form-label">Teacher / Staff Username</label>
          <input type="text" id="teacherUsernameInput" class="form-control" placeholder="Enter username (e.g. admin)" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" id="teacherPasswordInput" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-submit">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Teacher Portal
        </button>
        <div class="text-center">
          <button type="button" class="demo-pill-btn" id="fillTeacherDemoBtn">
            <i class="bi bi-key-fill text-warning"></i> Auto-fill Teacher Demo (admin / admin123)
          </button>
        </div>
      </form>

      <!-- Form 2: Student Portal Login -->
      <form id="studentLoginForm" style="display: none;">
        <div class="mb-3">
          <label class="form-label">Student Roll No / ID</label>
          <input type="text" id="studentRollInput" class="form-control" placeholder="e.g. AC-101" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Registered Phone Number</label>
          <input type="tel" id="studentPhoneInput" class="form-control" placeholder="e.g. 9821016457" required>
        </div>
        <button type="submit" class="btn-submit" style="background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);">
          <i class="bi bi-mortarboard-fill me-1"></i> Sign In as Student / Parent
        </button>
        <div class="text-center">
          <button type="button" class="demo-pill-btn" id="fillStudentDemoBtn">
            <i class="bi bi-person-check-fill text-info"></i> Auto-fill Student Demo (AC-101 / 9821016457)
          </button>
        </div>
      </form>

      <a href="index.html" class="back-home-link">
        <i class="bi bi-arrow-left me-1"></i> Back to Public Website
      </a>
      <div class="text-center mt-3">
        <button type="button" class="btn btn-sm btn-outline-light rounded-pill px-3 py-1 btn-install-app">
          <i class="bi bi-phone-fill text-warning me-1"></i> Install Mobile App
        </button>
      </div>
    </div>
  </div>

  <!-- Google Firebase SDKs (Cloud Database & Realtime Sync) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script>
    // Initialize cloud sync so students/teachers from cloud are ready on any new device
    if (typeof window.AlphaFirebase !== 'undefined') {
      window.AlphaFirebase.initSync();
    }
    const tabTeacherBtn = document.getElementById('tabTeacherBtn');
    const tabStudentBtn = document.getElementById('tabStudentBtn');
    const teacherLoginForm = document.getElementById('teacherLoginForm');
    const studentLoginForm = document.getElementById('studentLoginForm');
    const errorAlert = document.getElementById('loginErrorAlert');
    const errorText = document.getElementById('loginErrorText');

    function showError(msg) {
      errorText.textContent = msg;
      errorAlert.style.display = 'block';
    }
    function hideError() {
      errorAlert.style.display = 'none';
    }

    // Tab Toggle
    tabTeacherBtn.addEventListener('click', () => {
      tabTeacherBtn.classList.add('active');
      tabStudentBtn.classList.remove('active');
      teacherLoginForm.style.display = 'block';
      studentLoginForm.style.display = 'none';
      hideError();
    });

    tabStudentBtn.addEventListener('click', () => {
      tabStudentBtn.classList.add('active');
      tabTeacherBtn.classList.remove('active');
      studentLoginForm.style.display = 'block';
      teacherLoginForm.style.display = 'none';
      hideError();
    });

    // Auto-fill Demos
    document.getElementById('fillTeacherDemoBtn').addEventListener('click', () => {
      document.getElementById('teacherUsernameInput').value = 'admin';
      document.getElementById('teacherPasswordInput').value = 'admin123';
      hideError();
    });

    document.getElementById('fillStudentDemoBtn').addEventListener('click', () => {
      document.getElementById('studentRollInput').value = 'AC-101';
      document.getElementById('studentPhoneInput').value = '9821016457';
      hideError();
    });

    // Check if URL has ?type=student
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('type') === 'student') {
      tabStudentBtn.click();
    }

    // Teacher Form Submit
    teacherLoginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const u = document.getElementById('teacherUsernameInput').value.trim();
      const p = document.getElementById('teacherPasswordInput').value.trim();

      const res = AlphaAuth.loginTeacher(u, p);
      if (res.success) {
        window.location.href = 'portal.html';
      } else {
        showError(res.message || 'Invalid Username or Password');
      }
    });

    // Student Form Submit
    studentLoginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const roll = document.getElementById('studentRollInput').value.trim();
      const phone = document.getElementById('studentPhoneInput').value.trim();

      const res = AlphaAuth.loginStudent(roll, phone);
      if (res.success) {
        window.location.href = 'student-portal.html';
      } else {
        showError(res.message || 'Invalid Roll Number or Phone');
      }
    });
  </script>
  <script src="app-installer.js"></script>
</body>
</html>
